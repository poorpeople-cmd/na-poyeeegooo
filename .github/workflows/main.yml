

name: 24/7 OK.ru Simple Stream Bot
run-name: "OK.ru Live - Ch ${{ inputs.okru_stream_channel }} [${{ inputs.custom_duration || '24/7' }}]"

on:
  workflow_dispatch:
    inputs:
      target_urls:
        description: 'Comma-separated source page URLs in failover order'
        required: true
        type: string
        default: 'https://dadocric.st/player.php?id=starsp3&v=m'
      okru_stream_channel:
        description: 'OK.ru broadcast channel (e.g. 1, 1.1, 2, s1.1)'
        required: true
        type: string
        default: '1'
      server_selection:
        description: 'Player server button label. Use None to skip.'
        required: true
        type: string
        default: 'None'
      stream_quality:
        description: 'OBS output quality'
        required: true
        type: choice
        options:
          - 'Original (1080p Max)'
          - '1080p'
          - '720p'
          - '480p'
          - '360p'
        default: '720p'
      proxy_engine:
        description: 'Browser network connection'
        required: true
        type: choice
        options:
          - 'Cloudflare WARP (Recommended)'
          - 'None (Direct GitHub IP)'
        default: 'Cloudflare WARP (Recommended)'
      enable_stream_audio:
        description: 'Stream audio'
        required: true
        type: choice
        options: ['ON', 'OFF']
        default: 'ON'
      custom_duration:
        description: 'Duration (e.g. 3h, 180m, 1h 20m, or 24/7)'
        required: false
        type: string
        default: '24/7'

permissions:
  contents: read
  actions: write

concurrency:
  group: okru-broadcast-${{ inputs.okru_stream_channel }}
  cancel-in-progress: false

jobs:
  stream:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    env:
      TARGET_URLS: ${{ inputs.target_urls }}
      OKRU_STREAM_ID: ${{ inputs.okru_stream_channel }}
      SERVER_SELECTION: ${{ inputs.server_selection }}
      STREAM_QUALITY: ${{ inputs.stream_quality }}
      PROXY_ENGINE: ${{ inputs.proxy_engine }}
      ENABLE_STREAM_AUDIO: ${{ inputs.enable_stream_audio }}
      CUSTOM_DURATION: ${{ inputs.custom_duration || '24/7' }}
    steps:
      - name: Checkout project
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install OBS, audio, and X11 dependencies
        timeout-minutes: 7
        run: |
          sudo apt-get update
          sudo apt-get install -y obs-studio xvfb xauth x11-xserver-utils openbox pulseaudio pulseaudio-utils dbus-x11             libnss3 libgbm1 libasound2t64 libatk1.0-0t64 libatk-bridge2.0-0t64 libxss1

      - name: Install Node dependencies and Chrome for Testing
        timeout-minutes: 7
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: |
          npm ci --no-audit --no-fund
          npm run check
          env -u PUPPETEER_SKIP_DOWNLOAD ./node_modules/.bin/puppeteer browsers install chrome

      - name: Set up WARP local proxy
        if: inputs.proxy_engine == 'Cloudflare WARP (Recommended)'
        timeout-minutes: 5
        run: |
          curl -fsSL --retry 2 https://pkg.cloudflareclient.com/pubkey.gpg             | sudo gpg --batch --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          printf '%s\n' 'deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ noble main'             | sudo tee /etc/apt/sources.list.d/cloudflare-client.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y cloudflare-warp
          sudo systemctl start warp-svc
          warp-cli --accept-tos registration new
          warp-cli --accept-tos mode proxy
          warp-cli --accept-tos proxy port 40000
          warp-cli --accept-tos connect
          for attempt in {1..15}; do
            if curl --fail --silent --max-time 4 --proxy socks5h://127.0.0.1:40000               https://www.cloudflare.com/cdn-cgi/trace | tr -d '\r' | grep -Eq '^warp=(on|plus)$'; then
              echo "Verified WARP browser proxy on port 40000."
              exit 0
            fi
            sleep 2
          done
          echo "::error::WARP was selected but its proxy could not be verified."
          exit 1

      - name: Install optional uBlock Origin Lite
        continue-on-error: true
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if url=$(gh api repos/uBlockOrigin/uBOL-home/releases/latest             --jq 'first(.assets[]? | select(.name | endswith(".chromium.zip")) | .browser_download_url) // empty')             && [[ "$url" == https://github.com/uBlockOrigin/uBOL-home/releases/download/* ]]; then
            download=$(mktemp -d)
            trap 'rm -rf "$download"' EXIT
            if curl -fsSL --retry 2 --max-time 25 "$url" -o "$download/ubol.zip"               && unzip -q "$download/ubol.zip" -d "$download/extracted"; then
              manifest=$(find "$download/extracted" -name manifest.json -type f -print -quit)
              if [[ -n "$manifest" ]]; then
                mv "$(dirname "$manifest")" ublock-lite
                exit 0
              fi
            fi
          fi
          echo "::notice::uBlock Origin Lite is unavailable. Browser popup and domain filtering remain active."

      - name: Broadcast from the virtual display
        id: broadcast
        env:
          OKRU_STREAM_KEYS: ${{ secrets.OKRU_STREAM_KEYS }}
          OKRU_RTMP_SERVER: ${{ vars.OKRU_RTMP_SERVER }}
          RELAY_AFTER_MS: '19800000'
          CHROME_NO_SANDBOX: '1'
          PULSE_SINK: okru_capture
          PULSE_SOURCE: okru_capture.monitor
        run: |
          node stream.js --check-config
          if ! pactl info > /dev/null 2>&1; then
            pulseaudio --start --exit-idle-time=-1
          fi
          pactl load-module module-null-sink "sink_name=$PULSE_SINK" rate=48000 >/dev/null
          pactl set-default-sink "$PULSE_SINK"
          pactl set-default-source "$PULSE_SOURCE"

          case "$STREAM_QUALITY" in
            '360p') screen=640x360x24 ;;
            '480p') screen=854x480x24 ;;
            '720p') screen=1280x720x24 ;;
            '1080p'|'Original (1080p Max)') screen=1920x1080x24 ;;
            *) exit 1 ;;
          esac

          export LIBGL_ALWAYS_SOFTWARE=1
          exec xvfb-run -a -s "-screen 0 $screen -nolisten tcp" dbus-run-session -- bash -e -c '
            openbox >/dev/null 2>&1 &
            exec node stream.js
          '

      - name: Dispatch the next run
        if: steps.broadcast.outputs.next_duration != ''
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT_DURATION: ${{ steps.broadcast.outputs.next_duration }}
        run: |
          gh workflow run main.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"             -f "target_urls=$TARGET_URLS"             -f "okru_stream_channel=$OKRU_STREAM_ID"             -f "server_selection=$SERVER_SELECTION"             -f "stream_quality=$STREAM_QUALITY"             -f "proxy_engine=$PROXY_ENGINE"             -f "enable_stream_audio=$ENABLE_STREAM_AUDIO"             -f "custom_duration=$NEXT_DURATION"




































